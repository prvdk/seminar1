services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: space_center
      POSTGRES_USER: space_user
      POSTGRES_PASSWORD: space_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U space_user -d space_center"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - space-net

  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: space-operation-server:v1.0.0
    container_name: server
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/space_center
      SPRING_DATASOURCE_USERNAME: space_user
      SPRING_DATASOURCE_PASSWORD: space_password
      TELEMETRY_GRPC_ADDRESS: static://telemetry-service:9091
    depends_on:
      postgres:
        condition: service_healthy
      telemetry-service:
        condition: service_started
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/overview || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - space-net

  telemetry-service:
    build:
      context: ./telemetry-service
      dockerfile: Dockerfile
    image: telemetry-service:v1.0.0
    container_name: telemetry-service
    environment:
      SERVER_PORT: 8082
      GRPC_SERVER_PORT: 9091
    ports:
      - "9091:9091"
    networks:
      - space-net

  mission-service:
    build:
      context: ./mission-scheduler
      dockerfile: Dockerfile
    image: mission-scheduler:v1.0.0
    container_name: mission-service
    depends_on:
      server:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      SERVER_URL: http://server:8080/api
    ports:
      - "8081:8081"
    networks:
      - space-net

networks:
  space-net:
    driver: bridge
