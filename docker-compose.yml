services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: space-operation-server:v1.0.0
    container_name: server
    environment:
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/overview || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - space-net

  mission-service:
    build:
      context: ./mission-scheduler
      dockerfile: Dockerfile
    image: mission-scheduler:v1.0.0
    container_name: mission-service
    depends_on:
      server:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      SERVER_URL: http://server:8080/api
    ports:
      - "8081:8081"
    networks:
      - space-net

networks:
  space-net:
    driver: bridge
